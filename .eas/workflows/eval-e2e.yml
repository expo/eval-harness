# End-to-end Evaluation Harness: author once, evaluate in parallel, then create
# one offline collaborator-facing report from the available producer artifacts.
# Manual trigger only (consumes CI minutes + does a native iOS build).
#   eas workflow:run .eas/workflows/eval-e2e.yml
#
# Secrets come ONLY from the `production` environment (auto-injected as $VAR).
# Required for the selected authoring agent: CLAUDE_CODE_OAUTH_TOKEN
# (claude-code), OPENAI_API_KEY (codex), or META_API_KEY (muse-code).
# The downstream iOS evaluator always requires CLAUDE_CODE_OAUTH_TOKEN.
# GCS_BUCKET + GCP_SA_KEY (mirror exfil), BRAINTRUST_API_KEY (trace push).
# Braintrust defaults to project `expo-evals`; override with BRAINTRUST_PROJECT,
# BRAINTRUST_CC_PROJECT, or BRAINTRUST_EVAL_PROJECT.
# Push them with:  eas env:push production --path .env  (Secret visibility)
name: eval-e2e

defaults:
  image: sdk-57
  tools:
    bun: '1.3.14'
    node: '22.20.0'

on:
  workflow_dispatch:
    inputs:
      agent:
        type: choice
        options:
          - claude-code
          - codex
          - muse-code
        default: claude-code
        required: false
        description: Coding agent to author the app
      agent_model:
        type: string
        default: ''
        required: false
        description: Optional model alias/name; defaults to sonnet (Claude Code), gpt-5-mini (Codex), or muse-spark-1.2 (Muse)
      agent_reasoning_effort:
        type: choice
        options:
          - low
          - medium
          - high
        default: high
        required: false
        description: Reasoning effort for the selected coding agent
      evaluator_model:
        type: string
        default: claude-opus-4-8
        required: false
        description: Claude model used only by the iOS evaluator
      prd:
        type: string
        default: dataset/prds/hot_chocolate/prd/mvp.txt
        required: false
        description: >-
          PRD path under dataset/. Also determines which test plans run in
          eval_ios (auto-resolved from dataset/prd_test_plans.json) and which
          skills are expected in eval_skill (dataset/prd_skills.json).
      run_eval_ios:
        type: boolean
        default: false
        required: false
        description: Run the native iOS evaluator job
      run_eval_skill:
        type: boolean
        default: true
        required: false
        description: Run the skill-eval analyzer job
      skill_scenario:
        type: choice
        options:
          - skills_unavailable
          - skills_available_unmentioned
          - skills_available_mentioned
        default: skills_available_unmentioned
        required: false
        description: >-
          Authoring-enforced skill scenario. skills_unavailable disables skill
          install and Expo MCP entirely (negative control); the other two only
          differ in whether the prompt explicitly names skill_mention.
      skill_mention:
        type: string
        default: ''
        required: false
        description: Skill id to explicitly name in the prompt; only used when skill_scenario=skills_available_mentioned
      prompt_variant:
        type: string
        default: baseline
        required: false
        description: >-
          Authoring prompt variant id from dataset/prompts.json (e.g. baseline,
          realistic, minimal). An unknown id fails the run immediately rather than
          authoring with an empty prompt.

jobs:
  author_app:
    runs_on: linux-medium
    environment: production
    env:
      AGENT: ${{ inputs.agent || 'claude-code' }}
      AGENT_MODEL: ${{ inputs.agent_model || '' }}
      AGENT_REASONING_EFFORT: ${{ inputs.agent_reasoning_effort || 'high' }}
      PRD: ${{ inputs.prd || 'dataset/prds/hot_chocolate/prd/mvp.txt' }}
      SCENARIO: ${{ inputs.skill_scenario || 'skills_available_unmentioned' }}
      SKILL_MENTION: ${{ inputs.skill_mention || '' }}
      # No `|| 'baseline'` fallback: resolve_prompt.sh owns the default so it
      # can log that it applied one. The input's own YAML default still shows
      # in the dispatch UI.
      PROMPT_VARIANT: ${{ inputs.prompt_variant }}
    steps:
      - uses: eas/checkout

      - name: Author app with coding agent
        run: bash ./eval_harness/app_builder/scripts/author-app.sh

      - name: Package authored app
        if: ${{ always() }}
        run: bash eval_harness/utils/artifacts/package_artifact.sh authored-app authored-app.tar.gz authored-app.tar.gz

      - name: Upload authored app
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: authored-app
          path: authored-app.tar.gz

  eval_ios:
    if: ${{ inputs.run_eval_ios }}
    after: [author_app]
    runs_on: macos-medium
    environment: production
    env:
      AGENT: ${{ inputs.agent || 'claude-code' }}
      AGENT_MODEL: ${{ inputs.agent_model || '' }}
      AGENT_REASONING_EFFORT: ${{ inputs.agent_reasoning_effort || 'high' }}
      EVALUATOR_MODEL: ${{ inputs.evaluator_model || 'claude-opus-4-8' }}
      EVALUATOR_REASONING_EFFORT: high
      PRD_OVERRIDE: ${{ inputs.prd || '' }}
      EVAL_IOS_APP_MODE: release
    steps:
      - uses: eas/checkout

      - name: Download authored app
        uses: eas/download_artifact
        id: download_author
        with:
          name: authored-app

      - name: Materialize authored app safely
        run: |
          artifact_path="${{ steps.download_author.outputs.artifact_path }}"
          bun eval_harness/utils/artifacts/materialize.ts \
            --artifact "$artifact_path" --dest "$PWD/authored-app-input" --root-name authored-app

      - name: Check Claude subscription OAuth
        run: bash ./eval_harness/utils/shell/check_claude_auth.sh

      - name: Build, run, and evaluate authored app
        run: AUTHORED_ARTIFACT_ROOT="$PWD/authored-app-input" bash ./eval_harness/evaluator/ios_agentic/scripts/eval-ios-app.sh

      - name: Package iOS eval report
        if: ${{ always() }}
        run: |
          if [ ! -f ios-eval-report/manifest.json ]; then
            python3 eval_harness/utils/artifacts/create_diagnostic_artifact.py \
              --kind ios --author-artifact-root "$PWD/authored-app-input" \
              --out-dir "$PWD/ios-eval-report" --run-id '${{ workflow.id }}' \
              --stage workflow_preflight \
              --reason 'iOS evaluator did not produce a canonical artifact; inspect job logs' \
              --evaluator-model "$EVALUATOR_MODEL" \
              --evaluator-reasoning-effort "$EVALUATOR_REASONING_EFFORT"
          fi
          bash eval_harness/utils/artifacts/package_artifact.sh ios-eval-report ios-eval-report.tar.gz ios-eval-report.tar.gz

      - name: Upload iOS eval report
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: ios-eval-report
          path: ios-eval-report.tar.gz

  eval_skill:
    if: ${{ inputs.run_eval_skill }}
    after: [author_app]
    runs_on: linux-medium
    environment: production
    steps:
      - uses: eas/checkout

      - name: Download authored app
        uses: eas/download_artifact
        id: download_author
        with:
          name: authored-app

      - name: Materialize authored app safely
        run: |
          artifact_path='${{ steps.download_author.outputs.artifact_path }}'
          bun eval_harness/utils/artifacts/materialize.ts \
            --artifact "$artifact_path" --dest "$PWD/authored-app-input" --root-name authored-app

      - name: Analyze authored app for skill eval
        run: |
          AUTHORED_ARTIFACT="$PWD/authored-app-input" \
          SCENARIO='${{ inputs.skill_scenario }}' \
          OUT_DIR=skill-eval-report \
          bash ./eval_harness/evaluator/skill_invocation/scripts/eval-skill-use.sh

      - name: Package skill-eval report
        if: ${{ always() }}
        run: |
          if [ ! -f skill-eval-report/manifest.json ]; then
            python3 eval_harness/utils/artifacts/create_diagnostic_artifact.py \
              --kind skill --author-artifact-root "$PWD/authored-app-input" \
              --out-dir "$PWD/skill-eval-report" --run-id '${{ workflow.id }}' \
              --scenario '${{ inputs.skill_scenario }}' --stage workflow_preflight \
              --reason 'skill evaluator did not produce a canonical artifact; inspect job logs'
          fi
          bash eval_harness/utils/artifacts/package_artifact.sh skill-eval-report skill-eval-report.tar.gz skill-eval-report.tar.gz

      - name: Upload skill-eval report
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: skill-eval-report
          path: skill-eval-report.tar.gz

  report:
    after: [eval_ios, eval_skill]
    runs_on: linux-medium
    steps:
      - uses: eas/checkout

      - name: Download authored app
        uses: eas/download_artifact
        id: report_author
        with:
          name: authored-app

      - name: Download iOS eval report
        if: ${{ always() && inputs.run_eval_ios && after.eval_ios.status != 'skipped' }}
        uses: eas/download_artifact
        id: report_ios
        with:
          name: ios-eval-report

      - name: Download skill-eval report
        if: ${{ always() && inputs.run_eval_skill && after.eval_skill.status != 'skipped' }}
        uses: eas/download_artifact
        id: report_skill
        with:
          name: skill-eval-report

      - name: Build consolidated report
        if: ${{ always() }}
        run: |
          author_path='${{ steps.report_author.outputs.artifact_path }}'
          [ -n "$author_path" ] && [ "$author_path" != undefined ] && [ "$author_path" != null ] || {
            echo 'authored-app artifact is unavailable; cannot build the required report' >&2
            exit 1
          }
          bun eval_harness/utils/artifacts/materialize.ts \
            --artifact "$author_path" --dest "$PWD/report-inputs/author" --root-name authored-app
          report_args=(
            --authored-artifact report-inputs/author --out-dir eval-report
            --ios-job-status '${{ after.eval_ios.status }}'
            --skill-job-status '${{ after.eval_skill.status }}'
          )
          skill_path='${{ steps.report_skill.outputs.artifact_path }}'
          if [ -n "$skill_path" ] && [ "$skill_path" != undefined ] && [ "$skill_path" != null ]; then
            bun eval_harness/utils/artifacts/materialize.ts \
              --artifact "$skill_path" --dest "$PWD/report-inputs/skill" --root-name skill-eval-report
            report_args+=(--skill-artifact report-inputs/skill)
          else
            echo 'skill-eval artifact disabled or unavailable; continuing without it'
          fi
          ios_path='${{ steps.report_ios.outputs.artifact_path }}'
          if [ -n "$ios_path" ] && [ "$ios_path" != undefined ] && [ "$ios_path" != null ]; then
            bun eval_harness/utils/artifacts/materialize.ts \
              --artifact "$ios_path" --dest "$PWD/report-inputs/ios" --root-name ios-eval-report
            report_args+=(--ios-artifact report-inputs/ios)
          else
            echo 'iOS eval artifact disabled or unavailable; continuing without it'
          fi
          bun eval_harness/evaluator/reporting/main.ts "${report_args[@]}"

      - name: Package consolidated report
        if: ${{ always() }}
        run: bash eval_harness/utils/artifacts/package_artifact.sh eval-report eval-report.tar.gz eval-report.tar.gz

      - name: Upload consolidated report
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: eval-report
          path: eval-report.tar.gz
