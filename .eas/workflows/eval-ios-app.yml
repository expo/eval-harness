# Replay only the iOS/evaluator half of eval-e2e from a prior authored-app
# artifact. This is useful after changing evaluator or dev-client handshake code:
# no coding-agent authoring pass, but still rebuilds + serves + evaluates the
# same authored Expo project.
#
# Example:
#   eas workflow:run .eas/workflows/eval-ios-app.yml \
#     -F authored_app_url='https://wf-artifacts.eascdn.net/.../authored-app.tar.gz?...'
name: eval-ios-app

defaults:
  image: sdk-57
  tools:
    bun: '1.3.14'

on:
  workflow_dispatch:
    inputs:
      authored_app_artifact_id:
        type: string
        required: false
        description: EAS artifact ID for an authored-app artifact
      authored_app_url:
        type: string
        required: false
        description: Signed download URL for an authored-app.tar.gz artifact
      prd:
        type: string
        default: dataset/prds/hot_chocolate/prd/mvp.txt
        required: false
        description: >-
          PRD path under dataset/. Also determines which test plans run
          (auto-resolved from dataset/prd_test_plans.json).
      ios_app_mode:
        type: choice
        options:
          - dev-client
          - release
        default: release
        required: false
        description: iOS app mode to build for evaluation
      evaluator_model:
        type: string
        default: claude-opus-4-8
        required: false
        description: Claude model used by the iOS evaluator
      evaluator_reasoning_effort:
        type: choice
        options:
          - low
          - medium
          - high
        default: high
        required: false
        description: Reasoning effort for the iOS evaluator

jobs:
  eval_ios:
    runs_on: macos-medium
    environment: production
    env:
      PRD_OVERRIDE: ${{ inputs.prd || '' }}
      EVAL_IOS_APP_MODE: ${{ inputs.ios_app_mode || 'release' }}
      EVALUATOR_MODEL: ${{ inputs.evaluator_model || 'claude-opus-4-8' }}
      EVALUATOR_REASONING_EFFORT: ${{ inputs.evaluator_reasoning_effort || 'high' }}
    steps:
      - uses: eas/checkout

      - uses: eas/install_node_modules

      - name: Download authored app by artifact ID
        uses: eas/download_artifact
        id: download_author
        if: ${{ inputs.authored_app_artifact_id }}
        with:
          artifact_id: ${{ inputs.authored_app_artifact_id }}

      - name: Download authored app by signed URL
        id: download_author_from_url
        if: ${{ !inputs.authored_app_artifact_id && inputs.authored_app_url }}
        run: |
          AUTHORED_APP_URL='${{ inputs.authored_app_url }}'
          mkdir -p authored-app-download
          curl --fail --location --show-error "$AUTHORED_APP_URL" --output authored-app-download/authored-app.tar.gz
          set-output artifact_path "$(pwd)/authored-app-download/authored-app.tar.gz"

      - name: Materialize authored app safely
        run: |
          artifact_path="${{ steps.download_author.outputs.artifact_path || steps.download_author_from_url.outputs.artifact_path }}"
          bun eval_harness/utils/artifacts/materialize.ts \
            --artifact "$artifact_path" --dest "$PWD/authored-app-input" --root-name authored-app

      - name: Check Claude subscription OAuth
        run: bash ./eval_harness/utils/shell/check_claude_auth.sh

      - name: Build, run, and evaluate authored app
        run: AUTHORED_ARTIFACT_ROOT="$PWD/authored-app-input" bash ./eval_harness/evaluator/ios_agentic/scripts/eval-ios-app.sh

      - name: Package iOS eval report
        if: ${{ always() }}
        run: |
          if [ ! -f ios-eval-report/manifest.json ]; then
            python3 eval_harness/utils/artifacts/create_diagnostic_artifact.py \
              --kind ios --author-artifact-root "$PWD/authored-app-input" \
              --out-dir "$PWD/ios-eval-report" --run-id '${{ workflow.id }}' \
              --stage workflow_preflight \
              --reason 'iOS evaluator did not produce a canonical artifact; inspect job logs' \
              --evaluator-model "$EVALUATOR_MODEL" \
              --evaluator-reasoning-effort "$EVALUATOR_REASONING_EFFORT"
          fi
          bash eval_harness/utils/artifacts/package_artifact.sh ios-eval-report ios-eval-report.tar.gz '${{ workflow.id }}/ios-eval-report.tar.gz'

      - name: Upload iOS eval report
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: ios-eval-report
          path: ios-eval-report.tar.gz
