name: eval-skill-case-matrix

on:
  workflow_dispatch:
    inputs:
      case_spec:
        type: string
        required: true
        description: Skill-eval case spec path, for example evaluator/skill_eval_cases/core5/native-data-fetching.json
      agent:
        type: choice
        required: true
        default: claude
        options:
          - claude
          - codex
      agent_model:
        type: string
        required: false
        default: ""
        description: Optional coding-agent model override

jobs:
  skills_off_tools_on:
    name: skills_off_tools_on
    runs_on: macos-medium
    environment: production
    steps:
      - uses: eas/checkout

      - name: Run baseline authoring and eval
        run: |
          bash ./scripts/skill-eval/run-scenario.sh \
            --case '${{ inputs.case_spec }}' \
            --scenario skills_off_tools_on \
            --agent '${{ inputs.agent }}' \
            --agent-model '${{ inputs.agent_model }}'

      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: skill-eval-skills-off-tools-on
          path: |
            eval-out/**/*.tgz

  skills_available_unmentioned:
    name: skills_available_unmentioned
    runs_on: macos-medium
    environment: production
    steps:
      - uses: eas/checkout

      - name: Run natural-trigger authoring and eval
        run: |
          bash ./scripts/skill-eval/run-scenario.sh \
            --case '${{ inputs.case_spec }}' \
            --scenario skills_available_unmentioned \
            --agent '${{ inputs.agent }}' \
            --agent-model '${{ inputs.agent_model }}'

      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: skill-eval-skills-available-unmentioned
          path: |
            eval-out/**/*.tgz

  skills_available_mentioned:
    name: skills_available_mentioned
    runs_on: macos-medium
    environment: production
    steps:
      - uses: eas/checkout

      - name: Run mentioned-trigger authoring and eval
        run: |
          bash ./scripts/skill-eval/run-scenario.sh \
            --case '${{ inputs.case_spec }}' \
            --scenario skills_available_mentioned \
            --agent '${{ inputs.agent }}' \
            --agent-model '${{ inputs.agent_model }}'

      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: skill-eval-skills-available-mentioned
          path: |
            eval-out/**/*.tgz
