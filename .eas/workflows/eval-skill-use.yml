# Analyze a prior authored-app artifact for Expo skill trigger quality, context
# uptake, and optional outcome evidence from a prior evaluator artifact.
# Expected skills and their static_uptake_checks are resolved automatically
# from the artifact's authored PRD via dataset/prd_skills.json -- no case spec
# to pass in.
#
# Example:
#   eas workflow:run .eas/workflows/eval-skill-use.yml \
#     -F authored_app_url='https://wf-artifacts.eascdn.net/.../authored-app.tar.gz?...' \
#     -F scenario=skills_available_unmentioned
name: eval-skill-use

defaults:
  image: sdk-57
  tools:
    bun: '1.3.14'

on:
  workflow_dispatch:
    inputs:
      authored_app_artifact_id:
        type: string
        required: false
        description: EAS artifact ID for an authored-app artifact
      authored_app_url:
        type: string
        required: false
        default: ''
        description: Signed download URL for an authored-app.tar.gz artifact
      ios_eval_report_artifact_id:
        type: string
        required: false
        default: ''
        description: Optional EAS artifact ID for an ios-eval-report artifact
      ios_eval_report_url:
        type: string
        required: false
        default: ''
        description: Optional signed download URL for ios-eval-report.tar.gz
      scenario:
        type: choice
        options:
          - skills_unavailable
          - skills_available_unmentioned
          - skills_available_mentioned
        default: skills_available_unmentioned
        required: true
        description: Skill availability scenario for this artifact

jobs:
  skill_eval:
    runs_on: linux-medium
    environment: production
    env:
      AUTHORED_APP_ARTIFACT_ID: ${{ inputs.authored_app_artifact_id || '' }}
      AUTHORED_APP_URL: ${{ inputs.authored_app_url || '' }}
      IOS_EVAL_REPORT_URL: ${{ inputs.ios_eval_report_url || '' }}
      SKILL_SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: eas/checkout

      - uses: eas/install_node_modules

      - name: Check artifact input
        run: |
          if [ -z "$AUTHORED_APP_ARTIFACT_ID" ] && [ -z "$AUTHORED_APP_URL" ]; then
            echo "Provide either authored_app_artifact_id or authored_app_url"
            exit 1
          fi

      - name: Download authored app by artifact ID
        uses: eas/download_artifact
        id: download_author
        if: ${{ inputs.authored_app_artifact_id }}
        with:
          artifact_id: ${{ inputs.authored_app_artifact_id }}

      - name: Download authored app by signed URL
        id: download_author_from_url
        if: ${{ !inputs.authored_app_artifact_id && inputs.authored_app_url }}
        run: |
          mkdir -p authored-app-download
          curl --fail --location --show-error "$AUTHORED_APP_URL" --output authored-app-download/authored-app.tar.gz
          set-output artifact_path "$(pwd)/authored-app-download/authored-app.tar.gz"

      - name: Download iOS eval report by artifact ID
        uses: eas/download_artifact
        id: download_ios_eval
        if: ${{ inputs.ios_eval_report_artifact_id }}
        with:
          artifact_id: ${{ inputs.ios_eval_report_artifact_id }}

      - name: Download iOS eval report by signed URL
        id: download_ios_eval_from_url
        if: ${{ !inputs.ios_eval_report_artifact_id && inputs.ios_eval_report_url }}
        run: |
          mkdir -p ios-eval-report-download
          curl --fail --location --show-error "$IOS_EVAL_REPORT_URL" --output ios-eval-report-download/ios-eval-report.tar.gz
          set-output artifact_path "$(pwd)/ios-eval-report-download/ios-eval-report.tar.gz"

      - name: Materialize authored app safely
        run: |
          artifact_path='${{ steps.download_author.outputs.artifact_path || steps.download_author_from_url.outputs.artifact_path }}'
          bun node_modules/.bin/skill-analyzer materialize \
            --artifact "$artifact_path" --dest "$PWD/authored-app-input" --root-name authored-app

      - name: Analyze skill-eval artifacts
        run: |
          AUTHORED_ARTIFACT="$PWD/authored-app-input"
          EVAL_ARTIFACT='${{ steps.download_ios_eval.outputs.artifact_path || steps.download_ios_eval_from_url.outputs.artifact_path }}'
          if [ "$EVAL_ARTIFACT" = "undefined" ] || [ "$EVAL_ARTIFACT" = "null" ]; then
            EVAL_ARTIFACT=""
          fi
          AUTHORED_ARTIFACT="$AUTHORED_ARTIFACT" \
          EVAL_ARTIFACT="$EVAL_ARTIFACT" \
          SCENARIO="$SKILL_SCENARIO" \
          OUT_DIR=skill-eval-report \
          bash ./eval_harness/evaluator/skill_invocation/scripts/eval-skill-use.sh

      - name: Package skill-eval report
        if: ${{ always() }}
        run: |
          if [ ! -f skill-eval-report/manifest.json ]; then
            python3 eval_harness/utils/artifacts/create_diagnostic_artifact.py \
              --kind skill --author-artifact-root "$PWD/authored-app-input" \
              --out-dir "$PWD/skill-eval-report" --run-id '${{ workflow.id }}' \
              --scenario "$SKILL_SCENARIO" --stage workflow_preflight \
              --reason 'skill evaluator did not produce a canonical artifact; inspect job logs'
          fi
          bash eval_harness/utils/artifacts/package_artifact.sh skill-eval-report skill-eval-report.tar.gz '${{ workflow.id }}/skill-eval-report.tar.gz'

      - name: Upload skill-eval report
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: skill-eval-report
          path: skill-eval-report.tar.gz
