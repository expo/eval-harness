name: Ollama E2E

on:
  pull_request:
    paths:
      - '.github/workflows/ollama-e2e.yml'
      - 'packages/agent-eval-vitest/**'
      - 'packages/source-scan/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ollama-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ollama:
    name: Real Ollama evaluation (advisory)
    runs-on: ubuntu-24.04
    # Report model variability without blocking merges.
    continue-on-error: true
    timeout-minutes: 20
    env:
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_E2E_MODEL: qwen3:8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.0'
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Ollama 0.32.15
        run: |
          mkdir -p "$RUNNER_TEMP/ollama" "$RUNNER_TEMP/ollama-e2e"
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          curl --fail --location --retry 3 --max-time 600 \
            https://github.com/ollama/ollama/releases/download/v0.32.15/ollama-linux-amd64.tar.zst \
            --output "$archive"
          printf '%s  %s\n' 50539c5fe9bf85887733355098dcdb266b433cb8c73fa180713417e9ed6e42bb "$archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
          echo "OLLAMA_MODELS=$RUNNER_TEMP/ollama-models" >> "$GITHUB_ENV"
      - name: Start Ollama and pull the model
        run: |
          ollama serve > "$RUNNER_TEMP/ollama-e2e/server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ollama-e2e/server.pid"
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent "$OLLAMA_HOST/api/version" > "$RUNNER_TEMP/ollama-e2e/version.json"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/ollama-e2e/server.log"
            exit 1
          fi
          ollama pull "$OLLAMA_E2E_MODEL"
          curl --fail --silent "$OLLAMA_HOST/api/tags" > "$RUNNER_TEMP/ollama-e2e/models.json"
      - name: Run real model end-to-end test
        id: e2e
        working-directory: packages/agent-eval-vitest
        run: bun run test:e2e
      - name: Record outcome
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          {
            echo '### Ollama end-to-end evaluation (advisory)'
            echo "Model: $OLLAMA_E2E_MODEL"
            echo "Test step outcome: $E2E_OUTCOME"
            echo 'Inspect the uploaded Vitest results, agent transcript, and server log for failures.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop Ollama
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/ollama-e2e/server.pid"
          if [ -f "$pid_file" ]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
          fi
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ollama-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/agent-eval-vitest/.eval-results/ollama-e2e/
            ${{ runner.temp }}/ollama-e2e/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
