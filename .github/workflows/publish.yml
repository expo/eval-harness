# Configure each public package's npm trusted publisher:
# owner: expo; repository: eval-experiments; workflow: publish.yml;
# allowed action: npm publish. No NPM_TOKEN is needed.
name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        default: '@expo/agent-eval-vitest'
        options:
          - '@expo/agent-eval-vitest'
          - '@expo/skill-analyzer'
      version:
        description: Expected package.json version (already committed)
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string

permissions: {}

concurrency:
  group: publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'expo/eval-experiments'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2
      - run: bun install --frozen-lockfile
      - name: Check types and run offline TypeScript tests
        run: bun run typecheck && bun run test:ts
      - name: Check packed packages with npm and Bun consumers
        run: bun run test:pack
      - name: Pack release with resolved catalog dependencies
        env:
          NPM_PACKAGE: ${{ inputs.package }}
          NPM_VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ inputs.tag }}
        run: bun scripts/pack-release.ts
      - name: Publish tarball using npm OIDC
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: npm publish "$RUNNER_TEMP/eval-release.tgz" --ignore-scripts --access public --tag "$NPM_TAG"
