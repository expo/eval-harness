[project]
name = "expo-evals"
version = "0.1.0"
description = "Agentic evaluator for Expo Agent–built mobile apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.0.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agentic-evaluator = "agentic_evaluator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_evaluator"]
