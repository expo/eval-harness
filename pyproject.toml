[project]
name = "expo-evals"
version = "0.1.0"
description = "EAS-native evaluation harness for Expo coding-agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "braintrust>=0.3.0",
    "claude-agent-sdk>=0.0.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
test = [
    "coverage>=7,<8",
    "hypothesis>=6,<7",
]

[project.scripts]
agentic-evaluator = "eval_harness.evaluator.ios_agentic.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_harness"]
